function distM(lat1,lon1,lat2,lon2) {
  var R=6371000,p1=lat1*Math.PI/180,p2=lat2*Math.PI/180;
  var dp=(lat2-lat1)*Math.PI/180,dl=(lon2-lon1)*Math.PI/180;
  var a=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function convHull(pts) {
  if(pts.length<3) return pts;
  var sorted=[].concat(pts).sort(function(a,b){return a.lat===b.lat?a.lon-b.lon:a.lat-b.lat;});
  function cross(O,A,B){return(A.lat-O.lat)*(B.lon-O.lon)-(A.lon-O.lon)*(B.lat-O.lat);}
  var lo=[],hi=[];
  for(var i=0;i<sorted.length;i++){
    var p=sorted[i];
    while(lo.length>=2&&cross(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();
    lo.push(p);
  }
  for(var j=sorted.length-1;j>=0;j--){
    var q=sorted[j];
    while(hi.length>=2&&cross(hi[hi.length-2],hi[hi.length-1],q)<=0)hi.pop();
    hi.push(q);
  }
  hi.pop();lo.pop();
  return lo.concat(hi);
}

function inPoly(lat,lon,pts) {
  if(pts.length<3) return false;
  var inside=false,n=pts.length;
  for(var i=0,j=n-1;i<n;j=i++){
    var xi=pts[i].lat,yi=pts[i].lon,xj=pts[j].lat,yj=pts[j].lon;
    if(((yi>lon)!==(yj>lon))&&(lat<(xj-xi)*(lon-yi)/(yj-yi)+xi))inside=!inside;
  }
  return inside;
}

function distBorde(lat,lon,pts) {
  var min=1e9,n=pts.length;
  for(var i=0,j=n-1;i<n;j=i++){
    var p1=pts[j],p2=pts[i];
    var dx=p2.lat-p1.lat,dy=p2.lon-p1.lon,len2=dx*dx+dy*dy;
    var t=len2===0?0:Math.max(0,Math.min(1,((lat-p1.lat)*dx+(lon-p1.lon)*dy)/len2));
    var d=distM(lat,lon,p1.lat+t*dx,p1.lon+t*dy);
    if(d<min)min=d;
  }
  return min;
}

function bahiaDeEqs(eqs) {
  if(!eqs||eqs.length===0) return null;
  var best=null,bestN="",bestC=0;
  var sks=Object.keys(SECCIONES);
  for(var s=0;s<sks.length;s++){
    var subs=Object.keys(SECCIONES[sks[s]]);
    for(var ss=0;ss<subs.length;ss++){
      var lista=SECCIONES[sks[s]][subs[ss]];
      var cnt=0;
      for(var i=0;i<eqs.length;i++) if(lista.indexOf(eqs[i])>=0) cnt++;
      if(cnt>bestC){bestC=cnt;bestN=subs[ss];}
    }
  }
  if(!bestN||!BAHIAS[bestN]) return null;
  return {nombre:bestN,bahia:BAHIAS[bestN]};
}

window.App = function App() {
  var [paso,     setPaso]     = useState("eq");
  var [seccion,  setSeccion]  = useState("LINEAS");
  var [subSec,   setSubSec]   = useState("PUELCHES");
  var [eqSel,    setEqSel]    = useState([]);
  var [puntos,   setPuntos]   = useState([]);
  var [gpsVivo,  setGpsVivo]  = useState(null);
  var [gpsErr,   setGpsErr]   = useState(null);
  var [dentro,   setDentro]   = useState(null);
  var [dist,     setDist]     = useState(null);
  var [gpsPos,   setGpsPos]   = useState(null);
  var [gpsAcc,   setGpsAcc]   = useState(5);
  var [reconoc,  setReconoc]  = useState(false);
  var [popup,    setPopup]    = useState(false);
  var wReg=useRef(null),wMon=useRef(null),aInt=useRef(null),rTmr=useRef(null);

  var hull = puntos.length>=4 ? convHull(puntos) : [];
  var estado = dentro==null?"sg":dentro?"ok":dist>gpsAcc?"pe":"sg";
  var C = {
    ok:{bg:"#0d2416",bd:"#22c55e",tx:"#22c55e",em:"🟢",lb:"DENTRO DE ZONA"},
    ad:{bg:"#2b0808",bd:"#ef4444",tx:"#ef4444",em:"🔴",lb:"FUERA — PELIGRO"},
    pe:{bg:"#2b0808",bd:"#ef4444",tx:"#ef4444",em:"🔴",lb:"FUERA — PELIGRO"},
    sg:{bg:"#12181e",bd:"#475569",tx:"#94a3b8",em:"⚫",lb:"Obteniendo GPS..."}
  }[estado];

  // GPS para registro — con buffer ponderado para puntos más precisos
  useEffect(function(){
    if(paso==="pts"){
      if(!navigator.geolocation){setGpsErr("GPS no disponible");return;}
      var regBuf=[];
      wReg.current=navigator.geolocation.watchPosition(
        function(p){
          if(p.coords.accuracy>30) return;
          var now=Date.now();
          regBuf.push({lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,t:now});
          regBuf=regBuf.filter(function(r){return now-r.t<8000;});
          if(regBuf.length>5) regBuf=regBuf.slice(regBuf.length-5);
          var sL=0,sO=0,sW=0;
          for(var i=0;i<regBuf.length;i++){var w=1/(regBuf[i].acc*regBuf[i].acc);sL+=regBuf[i].lat*w;sO+=regBuf[i].lon*w;sW+=w;}
          var bAcc=Math.min.apply(null,regBuf.map(function(r){return r.acc;}));
          setGpsVivo({lat:sL/sW,lon:sO/sW,acc:Math.round(bAcc)});
        },
        function(e){var m=["","GPS bloqueado","Sin señal","GPS tardó"];setGpsErr(m[e.code]||"Error GPS");},
        {enableHighAccuracy:true,maximumAge:0,timeout:10000}
      );
    } else {
      if(wReg.current){navigator.geolocation.clearWatch(wReg.current);wReg.current=null;}
      setGpsVivo(null);setGpsErr(null);
    }
    return function(){if(wReg.current){navigator.geolocation.clearWatch(wReg.current);wReg.current=null;}};
  },[paso]);

    // GPS monitoreo
  useEffect(function(){
    if(paso==="mon"&&hull.length>=3){
      if(!navigator.geolocation) return;
      var gpsBuf=[];
      var outsideConsec=0;
      var warmup=0;
      var gpsCallback=function(p){
          if(p.coords.accuracy>30) return;
          var now=Date.now();
          var lat=p.coords.latitude,lon=p.coords.longitude,acc=p.coords.accuracy;
          var spd=p.coords.speed||0;
          // Movimiento detectado: descartar lecturas viejas para responder rápido
          if(spd>0.3){
            gpsBuf=gpsBuf.filter(function(r){return now-r.t<3000;});
          }
          // Rechazo de outliers: si el punto salta lejos del centroide sin velocidad, penalizar
          if(gpsBuf.length>=3){
            var sL=0,sO=0,sW=0;
            for(var j=0;j<gpsBuf.length;j++){var wj=1/(gpsBuf[j].acc*gpsBuf[j].acc);sL+=gpsBuf[j].lat*wj;sO+=gpsBuf[j].lon*wj;sW+=wj;}
            var jump=distM(lat,lon,sL/sW,sO/sW);
            if(jump>1.5*acc&&spd<0.3) acc=acc*2.5;
          }
          // Buffer: últimas 6 lecturas en 12 segundos
          gpsBuf.push({lat:lat,lon:lon,acc:acc,t:now});
          gpsBuf=gpsBuf.filter(function(r){return now-r.t<12000;});
          if(gpsBuf.length>6) gpsBuf=gpsBuf.slice(gpsBuf.length-6);
          // Centroide ponderado (1/acc²)
          var sumLat=0,sumLon=0,sumW=0;
          for(var i=0;i<gpsBuf.length;i++){
            var w=1/(gpsBuf[i].acc*gpsBuf[i].acc);
            sumLat+=gpsBuf[i].lat*w;sumLon+=gpsBuf[i].lon*w;sumW+=w;
          }
          var pLat=sumLat/sumW,pLon=sumLon/sumW;
          var bestAcc=Math.min.apply(null,gpsBuf.map(function(r){return r.acc;}));
          setGpsPos({lat:pLat,lon:pLon});
          setGpsAcc(Math.round(bestAcc));
          // Warm-up: primeras 5 lecturas calibran sin alarmar
          warmup++;
          if(warmup<5){setDentro(null);setDist(null);return;}
          // Verificar posición
          var d=inPoly(pLat,pLon,hull);
          var db=d?0:Math.round(distBorde(pLat,pLon,hull));
          setDist(db);
          if(d){
            outsideConsec=0;
            setDentro(true);
          } else {
            outsideConsec++;
            // Moviéndose: 1 lectura alcanza para alarmar (respuesta inmediata)
            // Quieto: requiere 2 lecturas consecutivas (evita falsos por ruido)
            var umbral=spd>0.3?1:2;
            if(outsideConsec>=umbral) setDentro(false);
          }
        };
      var gpsError=function(e){var m=["","GPS bloqueado","Sin señal","GPS tardó"];setGpsErr(m[e.code]||"Error GPS");};
      wMon.current=navigator.geolocation.watchPosition(gpsCallback,gpsError,
        {enableHighAccuracy:true,maximumAge:0,timeout:5000}
      );
    } else {
      if(wMon.current){navigator.geolocation.clearWatch(wMon.current);wMon.current=null;}
      setDentro(null);setDist(null);setGpsPos(null);
    }
    return function(){if(wMon.current){navigator.geolocation.clearWatch(wMon.current);wMon.current=null;}};
  },[paso,puntos.length]);

  // Alarma
  useEffect(function(){
    if(paso==="mon"&&estado==="pe"&&!reconoc){
      setPopup(true);
      beep("p");
      aInt.current=setInterval(function(){beep("p");},estado==="pe"?2000:6000);
    } else {
      clearInterval(aInt.current);
      if(estado==="ok"){setPopup(false);setReconoc(false);}
    }
    return function(){clearInterval(aInt.current);};
  },[estado,reconoc,paso]);

  function registrar() {
    if(!gpsVivo){setGpsErr("Esperá la señal GPS...");return;}
    if(gpsVivo.acc>30){setGpsErr("Señal baja (±"+gpsVivo.acc+"m) — esperá un momento");return;}
    if(puntos.length>0){
      var prev=puntos[puntos.length-1];
      var d=Math.round(distM(gpsVivo.lat,gpsVivo.lon,prev.lat,prev.lon));
      if(d<3){setGpsErr("Muy cerca del punto anterior ("+d+"m) — mové más");return;}
    }
    setGpsErr(null);
    setPuntos(function(prev){return prev.concat([{lat:gpsVivo.lat,lon:gpsVivo.lon,acc:gpsVivo.acc,num:prev.length+1}]);});
  }

  function activar() {
    if("Notification" in window&&Notification.permission==="default")Notification.requestPermission();
    if("wakeLock" in navigator)navigator.wakeLock.request("screen").catch(function(){});
    setPaso("mon");
  }

  function reconocer() {
    setReconoc(true);setPopup(false);
    clearTimeout(rTmr.current);
    rTmr.current=setTimeout(function(){setReconoc(false);},15000);
  }

  function reiniciar() {
    setPaso("eq");setPuntos([]);setDentro(null);setDist(null);
    setGpsPos(null);setReconoc(false);setPopup(false);setEqSel([]);
    if(wMon.current){navigator.geolocation.clearWatch(wMon.current);wMon.current=null;}
    clearInterval(aInt.current);
  }

  var subs=SECCIONES[seccion]||{};
  var subKeys=Object.keys(subs);
  if(subKeys.indexOf(subSec)<0)subSec=subKeys[0];
  var eqs=subs[subSec]||[];

  return (
    <div style={{minHeight:"100vh",background:"#0f1520",fontFamily:"monospace",maxWidth:480,margin:"0 auto",display:"flex",flexDirection:"column"}}>

      {/* POPUP */}
      {popup&&paso==="mon"&&!reconoc&&(
        <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,zIndex:999,
          background:estado==="pe"?"rgba(40,0,0,0.97)":"rgba(35,24,0,0.97)",
          display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
          padding:24,textAlign:"center"}}>
          <div style={{fontSize:80,marginBottom:12}}>{estado==="pe"?"🚨":"⚠️"}</div>
          <div style={{fontSize:20,fontWeight:900,color:C.tx,marginBottom:16,lineHeight:1.2}}>
            {estado==="pe"?"TE ALEJASTE DE LA ZONA DE TRABAJO":"ATENCIÓN — CERCA DEL LÍMITE"}
          </div>
          <div style={{background:"rgba(0,0,0,0.5)",borderRadius:12,padding:"14px 18px",
            marginBottom:20,maxWidth:300,fontSize:12,color:"#e5e7eb",lineHeight:1.8}}>
            {dist!=null?"Distancia al contorno: "+dist+"m":""}
            {"\nPRECAUCIÓN: áreas energizadas en las proximidades."}
          </div>
          <button onClick={reconocer} style={{width:"100%",maxWidth:300,padding:"16px",borderRadius:10,
            border:"none",cursor:"pointer",background:estado==="pe"?"#991b1b":"#b45309",
            color:"white",fontWeight:900,fontSize:15,fontFamily:"monospace",marginBottom:10}}>
            ⏸ ENTENDIDO — Silenciar 30 seg
          </button>
          <button onClick={reiniciar} style={{padding:"12px 24px",borderRadius:8,border:"1px solid #374151",
            cursor:"pointer",background:"transparent",color:"#6b7280",fontFamily:"monospace",fontSize:12}}>
            ⏹ Desactivar monitoreo
          </button>
        </div>
      )}

      {/* HEADER */}
      <div style={{background:"#f0f0f0",borderBottom:"3px solid #d97706",padding:"8px 12px",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <img src={window.LOGO_T||""} style={{height:44,objectFit:"contain"}} alt="Transener"/>
            <div style={{borderLeft:"2px solid #d97706",paddingLeft:8}}>
              <div style={{fontSize:9,color:"#d97706",letterSpacing:2,fontWeight:700}}>TRANSENER S.A.</div>
              <div style={{fontSize:12,color:"#cc5500",fontWeight:900}}>🦺 ZONA SEGURA</div>
              <div style={{fontSize:9,color:"#888"}}>ET HENDERSON 500 kV</div>
            </div>
          </div>
          <img src={window.LOGO_A||""} style={{height:44,objectFit:"contain"}} alt="ADN 2035"/>
        </div>
        {paso==="mon"&&(
          <div style={{marginTop:6,background:C.bg,border:"1px solid "+C.bd,borderRadius:6,
            padding:"6px 10px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontSize:12,fontWeight:700,color:C.tx}}>{C.em} {C.lb}</div>
              {dist>0&&<div style={{fontSize:11,color:C.tx}}>{dist}m fuera del contorno</div>}
              {gpsAcc&&<div style={{fontSize:9,color:"#475569"}}>GPS ±{gpsAcc}m — alarma activa a {gpsAcc+1}m del contorno</div>}
              {gpsErr&&<div style={{fontSize:9,color:"#f97316"}}>{gpsErr}</div>}
            </div>
            <button onClick={reiniciar} style={{padding:"5px 8px",borderRadius:4,border:"none",
              cursor:"pointer",background:"#450a0a",color:"#fca5a5",fontWeight:700,fontSize:11}}>
              ⏹ Fin
            </button>
          </div>
        )}
      </div>

      <div style={{flex:1,overflowY:"auto"}}>

        {/* PASO 1: EQUIPO */}
        {paso==="eq"&&(
          <div style={{padding:12}}>
            <div style={{fontSize:11,color:"#94a3b8",textAlign:"center",marginBottom:12}}>
              Seleccioná el equipo donde vas a trabajar (opcional)
            </div>
            <div style={{background:"#12181e",borderRadius:10,border:"1px solid #1e2d3d",padding:12,marginBottom:12}}>
              <div style={{display:"flex",overflowX:"auto",gap:4,marginBottom:8,paddingBottom:2}}>
                {Object.keys(SECCIONES).map(function(s){
                  return (
                    <button key={s} onClick={function(){setSeccion(s);setSubSec(Object.keys(SECCIONES[s])[0]);}}
                      style={{flexShrink:0,padding:"5px 8px",borderRadius:4,border:"none",cursor:"pointer",
                        fontFamily:"monospace",fontSize:9,fontWeight:700,whiteSpace:"nowrap",
                        background:seccion===s?"#1e3a5f":"#1a2535",color:seccion===s?"#60a5fa":"#475569"}}>
                      {s}
                    </button>
                  );
                })}
              </div>
              <div style={{display:"flex",overflowX:"auto",gap:4,marginBottom:8,paddingBottom:2}}>
                {subKeys.map(function(ss){
                  return (
                    <button key={ss} onClick={function(){setSubSec(ss);}}
                      style={{flexShrink:0,padding:"4px 8px",borderRadius:4,border:"none",cursor:"pointer",
                        fontFamily:"monospace",fontSize:9,whiteSpace:"nowrap",
                        background:subSec===ss?"#2d1a00":"#1a2535",color:subSec===ss?"#fbbf24":"#475569"}}>
                      {ss}
                    </button>
                  );
                })}
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                {eqs.map(function(id){
                  var sel=eqSel.indexOf(id)>=0;
                  return (
                    <button key={id} onClick={function(){setEqSel(function(prev){return sel?prev.filter(function(x){return x!==id;}):[].concat(prev,[id]);});}}
                      style={{padding:"5px 10px",borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:10,
                        background:sel?"#1e3a5f":"#1a2535",color:sel?"#60a5fa":"#64748b",
                        border:"1px solid "+(sel?"#3b82f6":"#1e2d3d")}}>
                      {sel?"✓ ":""}{id}
                    </button>
                  );
                })}
              </div>
              {eqSel.length>0&&<div style={{marginTop:8,fontSize:10,color:"#60a5fa"}}>✓ {eqSel.join(" · ")}</div>}
            </div>
            <button onClick={function(){setPaso("pts");}}
              style={{width:"100%",padding:"15px",borderRadius:10,border:"none",cursor:"pointer",
                background:"#d97706",color:"white",fontWeight:900,fontSize:15,fontFamily:"monospace"}}>
              SIGUIENTE → REGISTRAR ZONA GPS
            </button>
          </div>
        )}

        {/* PASO 2: PUNTOS GPS */}
        {paso==="pts"&&(
          <div style={{padding:12}}>
            <div style={{fontSize:11,color:"#94a3b8",textAlign:"center",marginBottom:10}}>
              Caminá a cada esquina y registrá el punto (mín. 4, máx. 10)
            </div>

            {/* GPS vivo */}
            <div style={{background:"#12181e",borderRadius:8,border:"1px solid #1e2d3d",padding:"10px 12px",marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                <span style={{color:"#94a3b8",fontSize:11,fontWeight:700}}>📡 GPS en vivo</span>
                {gpsVivo
                  ?<span style={{fontSize:11,fontWeight:700,color:gpsVivo.acc<=10?"#22c55e":gpsVivo.acc<=25?"#f59e0b":"#ef4444"}}>
                    ±{gpsVivo.acc}m {gpsVivo.acc<=10?"✓":gpsVivo.acc<=25?"⚠":"✗"}
                  </span>
                  :<span style={{color:"#475569",fontSize:11}}>Buscando...</span>
                }
              </div>
              {gpsVivo&&(
                <div style={{height:6,background:"#0a0f18",borderRadius:3,overflow:"hidden"}}>
                  <div style={{height:"100%",borderRadius:3,transition:"width 0.5s",
                    width:Math.max(0,Math.min(100,(30-gpsVivo.acc)/30*100))+"%",
                    background:gpsVivo.acc<=10?"#22c55e":gpsVivo.acc<=25?"#f59e0b":"#ef4444"}}/>
                </div>
              )}
            </div>

            {/* Lista puntos */}
            {puntos.length>0&&(
              <div style={{background:"#12181e",borderRadius:8,border:"1px solid #1e2d3d",padding:10,marginBottom:10}}>
                {puntos.map(function(p,i){
                  var dPrev=i>0?Math.round(distM(p.lat,p.lon,puntos[i-1].lat,puntos[i-1].lon)):null;
                  return (
                    <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                      padding:"6px 0",borderBottom:i<puntos.length-1?"1px solid #1e2d3d":"none"}}>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <div style={{width:24,height:24,borderRadius:"50%",background:"#d97706",
                          display:"flex",alignItems:"center",justifyContent:"center",
                          fontSize:11,fontWeight:900,color:"white",flexShrink:0}}>
                          {p.num}
                        </div>
                        <div>
                          <div style={{fontSize:9,color:"#475569"}}>{p.lat.toFixed(6)}, {p.lon.toFixed(6)}</div>
                          <div style={{fontSize:9,color:p.acc>20?"#f97316":"#22c55e"}}>
                            ±{p.acc}m {dPrev!=null?"· "+dPrev+"m del anterior":""}
                          </div>
                        </div>
                      </div>
                      <button onClick={function(){var idx=i;setPuntos(function(prev){return prev.filter(function(_,j){return j!==idx;}).map(function(pt,j){return Object.assign({},pt,{num:j+1});});});}}
                        style={{padding:"3px 7px",borderRadius:4,border:"1px solid #374151",
                          cursor:"pointer",background:"transparent",color:"#6b7280",fontSize:10}}>
                        ✕
                      </button>
                    </div>
                  );
                })}
              </div>
            )}

            {gpsErr&&<div style={{color:"#f97316",fontSize:11,textAlign:"center",marginBottom:8,
              padding:8,background:"#1a0a00",borderRadius:6}}>{gpsErr}</div>}

            <button onClick={registrar} disabled={!gpsVivo||puntos.length>=20}
              style={{width:"100%",padding:"14px",borderRadius:10,border:"none",marginBottom:8,
                cursor:(!gpsVivo||puntos.length>=20)?"not-allowed":"pointer",
                background:!gpsVivo?"#1e2d3d":puntos.length>=20?"#1f2937":"#1e4a1f",
                color:!gpsVivo?"#374151":"white",fontWeight:700,fontSize:14,fontFamily:"monospace"}}>
              {!gpsVivo?"⏳ Esperando GPS...":puntos.length>=20?"Máximo 20 puntos":"📍 REGISTRAR PUNTO "+(puntos.length+1)+" (±"+(gpsVivo?gpsVivo.acc:0)+"m)"}
            </button>

            {puntos.length<4&&puntos.length>0&&(
              <div style={{textAlign:"center",fontSize:10,color:"#374151",marginBottom:8}}>
                Faltan {4-puntos.length} punto{4-puntos.length>1?"s":""} más para activar
              </div>
            )}

            <div style={{display:"flex",gap:8}}>
              <button onClick={function(){setPaso("eq");}}
                style={{flex:1,padding:"10px",borderRadius:8,border:"1px solid #374151",
                  cursor:"pointer",background:"transparent",color:"#6b7280",fontFamily:"monospace",fontSize:12}}>
                ← Volver
              </button>
              {puntos.length>=4&&(
                <button onClick={activar}
                  style={{flex:2,padding:"12px",borderRadius:8,border:"none",cursor:"pointer",
                    background:"#d97706",color:"white",fontWeight:900,fontSize:14,fontFamily:"monospace"}}>
                  🦺 ACTIVAR ZONA
                </button>
              )}
            </div>
          </div>
        )}

        {/* PASO 3: MONITOREO */}
        {paso==="mon"&&(
          <div style={{margin:"4px",position:"relative",background:"#0a0f18",borderRadius:6}}>
            <svg viewBox="0 0 380 560" style={{width:"100%",display:"block"}}>

              {/* Relleno zona */}
              <rect x={14} y={14} width={352} height={532} rx={4}
                fill={dentro?"rgba(34,197,94,0.07)":"rgba(239,68,68,0.07)"}/>

              {/* CADENAS */}
              {(function(){
                var segs=[];
                var nH=Math.floor(352/14),nV=Math.floor(532/14);
                for(var i=0;i<nH;i++){
                  segs.push(<rect key={"ht"+i} x={14+i*14} y={10} width={13} height={8} rx={3} fill={i%2===0?"#ef4444":"#f8fafc"} opacity={0.95}/>);
                  segs.push(<rect key={"hb"+i} x={14+i*14} y={542} width={13} height={8} rx={3} fill={i%2===0?"#f8fafc":"#ef4444"} opacity={0.95}/>);
                }
                for(var j=0;j<nV;j++){
                  segs.push(<rect key={"vl"+j} x={10} y={14+j*14} width={8} height={13} rx={3} fill={j%2===0?"#ef4444":"#f8fafc"} opacity={0.95}/>);
                  segs.push(<rect key={"vr"+j} x={362} y={14+j*14} width={8} height={13} rx={3} fill={j%2===0?"#f8fafc":"#ef4444"} opacity={0.95}/>);
                }
                return segs;
              })()}

              {/* CONOS */}
              {[[14,14,1],[196,14,""],[366,14,2],[366,280,""],[366,546,3],[196,546,""],[14,546,4],[14,280,""]].map(function(c){
                var x=c[0],y=c[1],n=c[2];
                return <g key={x+"-"+y}>
                  <ellipse cx={x} cy={y+12} rx={11} ry={4} fill="#111" opacity={0.8}/>
                  <polygon points={x+","+(y-16)+" "+(x-9)+","+(y+11)+" "+(x+9)+","+(y+11)} fill="#f97316" stroke="#fb923c" strokeWidth={0.5}/>
                  <polygon points={(x-5)+","+(y-2)+" "+(x+5)+","+(y-2)+" "+(x+6)+","+(y+6)+" "+(x-6)+","+(y+6)} fill="white" opacity={0.9}/>
                  {n&&<text x={x} y={y+5} textAnchor="middle" fontFamily="monospace" fontSize={7} fill="#111" fontWeight="bold">{n}</text>}
                </g>;
              })}

              {/* CARTEL */}
              <rect x={90} y={22} width={200} height={72} rx={6} fill="#1a0000" stroke="#ef4444" strokeWidth={2}/>
              <rect x={90} y={22} width={200} height={22} rx={5} fill="#ef4444"/>
              <text x={190} y={37} textAnchor="middle" fontFamily="monospace" fontSize={11} fill="white" fontWeight="900">⛔ PROHIBIDO INGRESAR</text>
              <text x={190} y={54} textAnchor="middle" fontFamily="monospace" fontSize={9} fill="#fbbf24" fontWeight="700">SIN AUTORIZACIÓN DEL JT</text>
              <text x={190} y={67} textAnchor="middle" fontFamily="monospace" fontSize={8} fill="#94a3b8">ZONA DE TRABAJO — ET Henderson 500kV</text>
              <text x={190} y={84} textAnchor="middle" fontFamily="monospace" fontSize={7} fill="#475569">Transener S.A.</text>

              {/* EQUIPOS */}
              {eqSel.map(function(id,i){
                var tipo=EQ_TIPOS[id]||"SB";
                var isInt=tipo==="INT";
                var isTierra=tipo==="T";
                var fill=isInt?"#052e16":isTierra?"#1a0800":"#1e3a5f";
                var stroke=isInt?"#22c55e":isTierra?"#f97316":"#60a5fa";
                var label=isInt?"INTERRUPTOR":isTierra?"TIERRA":tipo==="SB"?"Sec. de Barra":"Sec. de Línea";
                var cy=130+i*90;
                var h=isInt?70:55;
                return <g key={id}>
                  {i>0&&<line x1={190} y1={cy-h/2-12} x2={190} y2={cy-h/2} stroke="#475569" strokeWidth={2}/>}
                  <rect x={80} y={cy-h/2} width={220} height={h} rx={6} fill={fill} stroke={stroke} strokeWidth={2.5}/>
                  <text x={190} y={cy-4} textAnchor="middle" fontFamily="monospace" fontSize={isInt?22:18} fill={stroke} fontWeight="900">{id}</text>
                  <text x={190} y={cy+12} textAnchor="middle" fontFamily="monospace" fontSize={10} fill={stroke}>{label}</text>
                  {isInt&&<text x={190} y={cy+25} textAnchor="middle" fontFamily="monospace" fontSize={9} fill={stroke}>★ EN ZONA DE TRABAJO</text>}
                </g>;
              })}

              {eqSel.length===0&&<text x={190} y={280} textAnchor="middle" fontFamily="monospace" fontSize={13} fill="#64748b">Sin equipos seleccionados</text>}

              {/* PUNTO GPS — área completa */}
              {gpsPos&&hull.length>=3&&(function(){
                var lats=hull.map(function(p){return p.lat;}),lons=hull.map(function(p){return p.lon;});
                var mnLat=Math.min.apply(null,lats),mxLat=Math.max.apply(null,lats);
                var mnLon=Math.min.apply(null,lons),mxLon=Math.max.apply(null,lons);
                var px=14+((gpsPos.lon-mnLon)/(mxLon-mnLon||0.0001))*340;
                var py=14+((mxLat-gpsPos.lat)/(mxLat-mnLat||0.0001))*520;
                px=Math.max(26,Math.min(354,px));
                py=Math.max(26,Math.min(534,py));
                var dc=dentro?"#22c55e":estado==="pe"?"#ef4444":"#f59e0b";
                return <g>
                  <circle cx={px} cy={py} r={10} fill={dc} stroke="white" strokeWidth={2.5}/>
                  <circle cx={px} cy={py} r={18} fill="none" stroke={dc} strokeWidth={1.5} opacity={0.4}/>
                  <text x={px} y={py+28} textAnchor="middle" fontFamily="monospace" fontSize={9} fill={dc} fontWeight="bold">YO {dist!=null?dist+"m":""}</text>
                </g>;
              })()}

            </svg>
          </div>
        )}

        {paso==="mon"&&estado==="pe"&&!reconoc&&(
          <button onClick={reconocer}
            style={{width:"100%",padding:"14px",border:"none",cursor:"pointer",
              background:estado==="pe"?"#7f1d1d":"#92400e",
              color:"white",fontWeight:900,fontSize:14,fontFamily:"monospace"}}>
            ⏸ RECONOCER ALARMA
          </button>
        )}
        {paso==="mon"&&reconoc&&(
          <div style={{textAlign:"center",color:"#f59e0b",fontSize:11,padding:8,background:"#1c1200"}}>
            ⏸ Alarma reconocida — se reactiva en 30 segundos
          </div>
        )}
      </div>

      <div style={{borderTop:"1px solid #1e2d3d",padding:"5px",textAlign:"center",
        fontSize:8,color:"#1e2d3d",flexShrink:0}}>
        Zona de Trabajo Seguro · ET Henderson 500kV · Transener S.A.
      </div>
    </div>
  );
}

  </script>
  <script>
    window.addEventListener('load',function(){
      try{
        var code=document.getElementById('app-code').textContent;
        var out=Babel.transform(code,{presets:['react']}).code;
        var h='var useState=React.useState,useEffect=React.useEffect,useRef=React.useRef;';
        eval(h+out);
        if(!window.App)throw new Error('App no definida');
        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(window.App));
      }catch(e){document.getElementById('err').textContent='ERROR: '+e.message;}
    });
  </script>
</body>
</html>
